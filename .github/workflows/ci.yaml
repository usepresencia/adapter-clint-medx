name: CI

on:
    push:
        branches: ['develop', 'main']
    pull_request:
        branches: ['develop', 'main']

jobs:
    build:
        runs-on: ubuntu-latest
        name: Validate, Lint, Test, Build (NestJS)

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: adapter
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adapter
            REDIS_URL: redis://localhost:6379

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Fetch PR commits
              if: github.event_name == 'pull_request'
              run: |
                  git fetch --no-tags --prune origin "${{ github.event.pull_request.base.ref }}"
                  git fetch --no-tags --prune origin "pull/${{ github.event.pull_request.number }}/head:pr"

            - name: Validate Commit Messages
              if: github.event_name == 'pull_request'
              run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to pr --verbose

            - name: Generate Prisma Client
              run: npm run prisma:generate

            - name: Run database migrations
              run: npx prisma migrate deploy

            - name: Lint code
              run: npm run lint

            - name: Check code formatting
              run: npx prettier '**/*.{css,scss,yaml,yml,ts,js,jsx,tsx,json,md}' --check

            - name: Run tests
              run: npm test

            - name: Build project
              run: npm run build

    release:
        runs-on: ubuntu-latest
        name: Release
        needs: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Release
              run: |
                  npm run release
                  git push --follow-tags origin main
